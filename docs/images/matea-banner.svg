<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Matea — local-first action assistant</title><desc id="desc">ChatGPT working through Matea with projects, tools, and reviewable evidence.</desc><defs><linearGradient id="bg" x1="60" y1="30" x2="1220" y2="610"><stop stop-color="#07111F"/><stop offset=".55" stop-color="#10233E"/><stop offset="1" stop-color="#0A172B"/></linearGradient><linearGradient id="accent" x1="80" y1="0" x2="560" y2="0"><stop stop-color="#77E7D7"/><stop offset="1" stop-color="#8DB3FF"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#B4C9EA" stroke-opacity=".09"/></pattern></defs><rect width="1280" height="640" rx="32" fill="url(#bg)"/><rect width="1280" height="640" rx="32" fill="url(#grid)"/><text x="78" y="205" fill="#F7FAFF" font-family="system-ui,sans-serif" font-size="96" font-weight="800">Matea</text><text x="80" y="270" fill="url(#accent)" font-family="system-ui,sans-serif" font-size="38" font-weight="800">Understand · Act · Remember</text><text x="80" y="330" fill="#D9E6FA" font-family="system-ui,sans-serif" font-size="23" font-weight="600">Your local-first action assistant for software work.</text><text x="80" y="370" fill="#BFD0EA" font-family="system-ui,sans-serif" font-size="20">Durable context, bounded execution, reviewable evidence.</text><g font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle"><rect x="80" y="430" width="180" height="48" rx="24" fill="#0C263F" stroke="#71DCCD"/><text x="170" y="460" fill="#EEFFFC">Project context</text><rect x="280" y="430" width="180" height="48" rx="24" fill="#112746" stroke="#8CB4FF"/><text x="370" y="460" fill="#F2F6FF">Bounded action</text><rect x="80" y="496" width="180" height="48" rx="24" fill="#17213B" stroke="#B8A8FF"/><text x="170" y="526" fill="#F5F1FF">Durable memory</text><rect x="280" y="496" width="180" height="48" rx="24" fill="#29220F" stroke="#FFC36F"/><text x="370" y="526" fill="#FFF6E8">Connected tools</text></g><rect x="700" y="86" width="500" height="468" rx="30" fill="#FFFFFF" fill-opacity=".08" stroke="#D8E6FF" stroke-opacity=".25"/><text x="760" y="190" fill="#F7FAFF" font-family="system-ui,sans-serif" font-size="30" font-weight="800">ChatGPT</text><text x="950" y="190" fill="#C1F2EA" font-family="system-ui,sans-serif" font-size="34" font-weight="800">Matea</text><text x="1080" y="190" fill="#FFF1D2" font-family="system-ui,sans-serif" font-size="28" font-weight="800">Work</text><path d="M850 180H930M1040 180H1070" stroke="#94BBFF" stroke-width="4"/><rect x="750" y="260" width="190" height="110" rx="22" fill="#201A38" stroke="#B7A7FF"/><text x="780" y="310" fill="#FAF8FF" font-family="system-ui,sans-serif" font-size="24" font-weight="800">Tools &amp; Agents</text><text x="780" y="342" fill="#DED6FF" font-family="system-ui,sans-serif" font-size="15">code · browser · services</text><rect x="970" y="260" width="190" height="110" rx="22" fill="#12263C" stroke="#8DB3FF"/><text x="1000" y="310" fill="#F7FAFF" font-family="system-ui,sans-serif" font-size="24" font-weight="800">Evidence</text><text x="1000" y="342" fill="#D2E0F6" font-family="system-ui,sans-serif" font-size="15">diffs · checks · history</text><text x="80" y="590" fill="#8FA9CF" font-family="system-ui,sans-serif" font-size="15" font-weight="650">Matea by Moretea Labs · Open source · MIT</text></svg>
