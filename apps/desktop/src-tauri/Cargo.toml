[package]
name = "forge-v3-desktop"
version = "0.1.0"
description = "Forge V3 Desktop native shell"
authors = ["Moretea Labs contributors"]
edition = "2021"

[lib]
name = "forge_v3_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
