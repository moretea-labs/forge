name: Windows smoke

on:
  pull_request:
    paths:
      - "install.ps1"
      - "install.sh"
      - "bin/**"
      - "src/**"
      - "tests/cli/install.test.ts"
      - "tests/runtime/process-environment.test.ts"
      - "tests/windows-paths.test.ts"
      - "scripts/check-platform-support.mjs"
      - "docs/operations/platform-support.md"
      - ".github/workflows/windows-smoke.yml"
  push:
    branches: [main]
    paths:
      - "install.ps1"
      - "install.sh"
      - "bin/**"
      - "src/**"
      - "tests/cli/install.test.ts"
      - "tests/runtime/process-environment.test.ts"
      - "tests/windows-paths.test.ts"
      - "scripts/check-platform-support.mjs"
      - "docs/operations/platform-support.md"
      - ".github/workflows/windows-smoke.yml"
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.10"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: PowerShell installer dry run
        shell: pwsh
        run: .\install.ps1 -DryRun -Runtime auto
      - name: Temporary #129 typecheck
        run: bun run check:type
      - name: Temporary #129 MCP compatibility
        run: bun run check:mcp-compatibility
      - name: Temporary #129 Recovery regression
        shell: bash
        run: |
          bun test tests/runtime/standalone-recovery.test.ts -t "Recovery MCP stays stateless across protocol eras and gateway replacement"
          bun test tests/runtime/standalone-recovery.test.ts -t "Recovery Connector verifier requires stateless legacy MCP across SSE responses"
      - name: Platform contract
        run: bun run check:platform-support
      - name: Installer and Windows policy tests
        run: bun test tests/cli/install.test.ts tests/runtime/process-environment.test.ts tests/windows-paths.test.ts
      - name: Node portable smoke
        run: bun run test:node-smoke
