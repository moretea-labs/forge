name: Forge ChatGPT Connector Cloud AB

on:
  push:
    branches:
      - benchmark/chatgpt-connector-cloud-ab-20260824

permissions:
  contents: read

jobs:
  host-cloud-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Host Forge through dedicated Cloud tunnel
        env:
          FORGE_CLOUD_TUNNEL_ID: tunnel_6a8a862b52188191b859cf61e7cdb9a3
          FORGE_CLOUD_TUNNEL_RUNTIME_API_KEY: ${{ secrets.FORGE_CLOUD_TUNNEL_RUNTIME_API_KEY }}
          FORGE_CLOUD_MCP_HOLD_SECONDS: '600'
        run: bash scripts/host-temporary-cloud-mcp-e2e.sh
