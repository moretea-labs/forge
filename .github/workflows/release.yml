name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@latest

      - name: Validate exact tag and release channel
        shell: bash
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}" node scripts/check-release-version.mjs --require-tag
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${VERSION}" == *-rc.* ]]; then
            CHANNEL=next
          else
            CHANNEL=latest
          fi
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=${CHANNEL}" >> "$GITHUB_ENV"

      - name: Run release gate and create one tarball
        run: bun run check:release

      - name: Check exact npm version
        id: registry
        shell: bash
        run: |
          if npm view "@moretea-labs/forge@${RELEASE_VERSION}" version --json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the verified tarball
        if: steps.registry.outputs.exists != 'true'
        shell: bash
        run: |
          TARBALL_PATH="$(cat .ai/harness/artifacts/release/latest-tarball.txt)"
          npm publish "$TARBALL_PATH" --tag "${RELEASE_CHANNEL}" --access public

      - name: Create matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=("${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Forge ${RELEASE_VERSION}")
          if [[ "${RELEASE_CHANNEL}" == "next" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
