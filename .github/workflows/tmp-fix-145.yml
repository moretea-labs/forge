name: tmp-fix-145
on:
  push:
    branches:
      - fix/control-plane-session-tunnel-recovery
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/control-plane-session-tunnel-recovery
          fetch-depth: 0
      - name: Apply bounded type-narrowing fix and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/cli/commands/setup-profile.ts')
          text = p.read_text()
          old = 'function isLoopbackMcpEndpoint(value: string | undefined): boolean {'
          new = 'function isLoopbackMcpEndpoint(value: string | undefined): value is string {'
          if old not in text:
              raise SystemExit('expected type predicate anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-fix-145.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli/commands/setup-profile.ts .github/workflows/tmp-fix-145.yml
          git commit -m "fix(setup): narrow verified tunnel endpoint"
          git push origin HEAD:fix/control-plane-session-tunnel-recovery
