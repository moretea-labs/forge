name: Forge ChatGPT Facade AB

on:
  push:
    branches:
      - benchmark/chatgpt-facade-ab-20260825

permissions:
  contents: read

jobs:
  host-facade-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate facade MCP host
        run: |
          bash -n scripts/host-temporary-cloud-mcp-e2e.sh
          bun test tests/runtime/runtime-observability.test.ts
          bun run check:mcp-compatibility
      - name: Host facade Forge through dedicated Cloud tunnel
        env:
          FORGE_CLOUD_TUNNEL_ID: tunnel_6a8a862b52188191b859cf61e7cdb9a3
          FORGE_CLOUD_TUNNEL_RUNTIME_API_KEY: ${{ secrets.FORGE_CLOUD_TUNNEL_RUNTIME_API_KEY }}
          FORGE_CLOUD_MCP_AUTH_MODE: none
          FORGE_CLOUD_MCP_TOOLSET: facade
          FORGE_CLOUD_MCP_HOLD_SECONDS: '1800'
        run: bash scripts/host-temporary-cloud-mcp-e2e.sh
