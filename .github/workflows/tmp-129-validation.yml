name: Temporary #129 validation

on:
  push:
    branches:
      - fix/129-recovery-sessionless-cutover

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check:type
      - name: MCP compatibility
        run: bun run check:mcp-compatibility
      - name: Main governed gate
        env:
          TEST_BASE_REF: origin/kernel-v2/architecture
        run: bun run check:main
