name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-gate:
    name: Main gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install ripgrep source-search dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version

      - name: Install dependencies from the committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Run one content-addressed main gate
        env:
          TEST_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bun run check:main

      - name: Verify packaged clean-install portability
        run: npm run check:portable-package
