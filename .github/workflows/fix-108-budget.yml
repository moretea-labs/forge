name: One-shot verify issue 108 budget

on:
  push:
    branches:
      - fix/108-live-schema-refresh

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/108-live-schema-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Synchronize governed test-line budget
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test-manifest.v1.json')
          text = p.read_text()
          old = '"maxTestLines": 45601'
          new = '"maxTestLines": 45693'
          if text.count(old) != 1:
              raise SystemExit(f'expected one current budget entry, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run governed main gate
        env:
          TEST_BASE_REF: origin/main
        run: bun run check:main
      - name: Commit verified budget sync and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "forge-issue-repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-108-budget.yml
          git add tests/test-manifest.v1.json
          git commit -m "test(mcp): budget live schema refresh coverage"
          git push origin HEAD:fix/108-live-schema-refresh
